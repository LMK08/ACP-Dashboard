name: Scheduled Data Update

permissions:
  contents: write

on:
  schedule:
    # Runs at 05:00 UTC on Sunday and Monday,
    # which is 12:00 AM EST (midnight) on Sat/Sun night.
    - cron: '0 5 * * 0,1'
  
  # This line allows you to run the update manually from the GitHub "Actions" tab
  workflow_dispatch:
    inputs:
      test_fetch_limit:
        description: 'Limit new matches per competition (0 = no limit, 10 = test mode)'
        required: false
        default: '0'

concurrency:
  group: scheduled-update
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 
          cache: 'pip'
          cache-dependency-path: requirements.txt 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests python-dotenv

      - name: Run process_data.py
        env:
          WYSCOUT_USER: ${{ secrets.WYSCOUT_USER }}
          WYSCOUT_PASS: ${{ secrets.WYSCOUT_PASS }}
          WYSCOUT_USER_NEW: ${{ secrets.WYSCOUT_USER_NEW }}
          WYSCOUT_PASS_NEW: ${{ secrets.WYSCOUT_PASS_NEW }}
          TEST_FETCH_LIMIT: ${{ github.event.inputs.test_fetch_limit || '0' }}
        run: python process_data.py

      - name: Run get_player_details.py
        env:
          WYSCOUT_USER: ${{ secrets.WYSCOUT_USER }}
          WYSCOUT_PASS: ${{ secrets.WYSCOUT_PASS }}
          WYSCOUT_USER_NEW: ${{ secrets.WYSCOUT_USER_NEW }}
          WYSCOUT_PASS_NEW: ${{ secrets.WYSCOUT_PASS_NEW }}
        run: python get_player_details.py

      - name: Fetch team advanced stats
        env:
          WYSCOUT_USER: ${{ secrets.WYSCOUT_USER }}
          WYSCOUT_PASS: ${{ secrets.WYSCOUT_PASS }}
          WYSCOUT_USER_NEW: ${{ secrets.WYSCOUT_USER_NEW }}
          WYSCOUT_PASS_NEW: ${{ secrets.WYSCOUT_PASS_NEW }}
        run: python fetch_team_stats.py

      - name: Update prediction model
        run: python update_model.py

      - name: Simulate season probabilities
        run: python simulate_season.py

      - name: Commit and push new data to GitHub
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'github-actions-bot@users.noreply.github.com'

          git add -f *.parquet
          git add -f *.pkl

          if [ -n "$(git status --porcelain)" ]; then
            echo "New data found. Committing and pushing..."
            git commit -m "chore: Automated data refresh"
            git pull --rebase
            git push
          else
            echo "No data changes to commit."
          fi

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          DEPLOY_DIR=$(mktemp -d)
          rsync -a --exclude='.git' --exclude='venv' --exclude='__pycache__' \
                   --exclude='.DS_Store' --exclude='.env' --exclude='.gitignore' \
                   . "$DEPLOY_DIR/"
          cd "$DEPLOY_DIR"
          git init -b main
          git lfs install
          git lfs track "*.parquet"
          git lfs track "*.pkl"
          git add .gitattributes
          git add -A
          git -c user.name="GitHub Actions" -c user.email="actions@github.com" \
              commit -m "Deploy from $(git -C $GITHUB_WORKSPACE rev-parse --short HEAD)"
          git remote add hf https://LMK08:${HF_TOKEN}@huggingface.co/spaces/LMK08/ACP-Dashboard
          git push hf main --force
          echo "Successfully deployed to Hugging Face Space"