name: Precompute Stats Caches

# Lightweight cache-only refresh: warms the per-(league,season) +
# per-league All-Seasons player-stats caches by running app.py --precompute
# against the live raw_events, then commits + deploys them. Skips the full
# engine chain (Phases 0-2) — uses the already-committed engine parquets.
# ~15 min vs the full engine rebuild's ~50. Manual trigger.

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: hf-deploy          # share with engine rebuild / deploy — never push HF simultaneously
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out dashboard repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # streamlit (HF SDK provides it, not in requirements) + stats deps
          pip install streamlit xgboost scikit-learn scipy pyarrow joblib pandas numpy

      - name: Download canonical raw_events from HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          curl -L -f -o raw_events.parquet \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            "https://huggingface.co/spaces/ACP-Analytics/ACP-Dashboard/resolve/main/raw_events.parquet"
          echo "raw_events: $(du -h raw_events.parquet | cut -f1)"

      - name: Warm player-stats caches
        run: python app.py --precompute

      - name: Verify all expected cache scopes were written
        run: |
          missing=0
          for s in 188221 188222 189147 190090 191782 all_43324 190230 191779 all_702; do
            if [ ! -f "stats_cache/player_stats_v13_${s}.parquet" ]; then
              echo "MISSING: stats_cache/player_stats_v13_${s}.parquet"; missing=1
            fi
          done
          [ "$missing" = "0" ] && echo "all 9 scopes present" || (echo "::error::missing cache scopes"; exit 1)

      - name: Commit refreshed caches to GitHub
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'github-actions-bot@users.noreply.github.com'
          git add -f stats_cache/ 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: refresh precomputed stats caches"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "No cache changes to commit."
          fi

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          DEPLOY_DIR=$(mktemp -d)
          rsync -a --exclude='.git' --exclude='venv' --exclude='__pycache__' \
                   --exclude='.DS_Store' --exclude='.env' --exclude='.gitignore' \
                   . "$DEPLOY_DIR/"
          find "$DEPLOY_DIR" -type d -name plots -exec rm -rf {} + 2>/dev/null || true
          find "$DEPLOY_DIR" -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) -delete 2>/dev/null || true
          cd "$DEPLOY_DIR"
          git init -b main
          git lfs install
          git lfs track "*.parquet"
          git lfs track "*.pkl"
          git add .gitattributes
          git add -A
          git -c user.name="GitHub Actions" -c user.email="actions@github.com" \
              commit -m "Cache refresh deploy"
          git remote add hf https://LMK08:${HF_TOKEN}@huggingface.co/spaces/ACP-Analytics/ACP-Dashboard
          git push hf main --force
          echo "✅ Deployed cache refresh to HF Space"
