name: Precompute Stats Caches

# Lightweight cache-only refresh: warms the per-(league,season) +
# per-league All-Seasons player-stats caches by running app.py --precompute
# against the live raw_events, then commits + deploys them. Skips the full
# engine chain (Phases 0-2) — uses the already-committed engine parquets.
# ~15 min vs the full engine rebuild's ~50. Manual trigger.

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

concurrency:
  group: hf-deploy          # share with engine rebuild / deploy — never push HF simultaneously
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out dashboard repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # streamlit (HF SDK provides it, not in requirements) + stats deps
          pip install "streamlit==1.50.0" xgboost scikit-learn scipy pyarrow joblib pandas numpy

      - name: Download canonical raw_events from HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          curl -L -f -o raw_events.parquet \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            "https://huggingface.co/spaces/ACP-Analytics/ACP-Dashboard/resolve/main/raw_events.parquet"
          echo "raw_events: $(du -h raw_events.parquet | cut -f1)"

      - name: Warm player-stats caches
        run: python app.py --precompute

      - name: Verify all expected cache scopes were written
        # Version and seasons come from the app/config (this check used to
        # hard-code v15 and a season list without 2026/27).
        run: |
          python - <<'PY'
          import re, os, sys
          from league_config import COMPETITIONS
          ver = re.search(r"^STATS_CACHE_VERSION = '([^']+)'", open('app.py').read(), re.M).group(1)
          scopes = [str(s) for c in COMPETITIONS.values() for s in c['seasons']]
          scopes += [f"all_{cid}" for cid in COMPETITIONS]
          missing = [s for s in scopes if not os.path.exists(f"stats_cache/player_stats_{ver}_{s}.parquet")]
          print(f"{len(scopes) - len(missing)}/{len(scopes)} scopes present ({ver})")
          if missing:
              print("::error::missing cache scopes: " + ", ".join(missing)); sys.exit(1)
          PY

      - name: Commit refreshed caches to GitHub
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'github-actions-bot@users.noreply.github.com'
          git add -f stats_cache/ 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: refresh precomputed stats caches"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "No cache changes to commit."
          fi

      - name: Deploy through deploy_to_hf.yml
        # one deploy path for code, engine and caches: smoke-tested, keeps the
        # Space's raw_events and the team crests (this workflow's own
        # force-push used to delete every PNG, crests included)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy_to_hf.yml --ref main
