name: Deploy to Hugging Face

on:
  push:
    branches: [main]
    # Don't trigger on data file changes (those come from scheduled_update which has its own deploy)
    paths-ignore:
      - '*.pkl'
      - '*.parquet'
      - 'matches_summary.parquet'
      - 'team_advanced_stats.parquet'
      - 'historical_events.parquet'
      - 'historical_matches.parquet'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download raw_events.parquet from HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # raw_events.parquet is too large for GitHub (>100MB) so it lives only on HF.
          # Download it so we can include it in the deploy.
          # CRITICAL: Fail the workflow if download fails — never deploy without this file.
          curl -L -f -o raw_events.parquet \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            "https://huggingface.co/spaces/LMK08/ACP-Dashboard/resolve/main/raw_events.parquet"
          echo "✅ Downloaded raw_events.parquet ($(du -h raw_events.parquet | cut -f1))"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Build a clean single-commit repo and force-push to HF.
          # Only one commit = only one copy of each file.
          DEPLOY_DIR=$(mktemp -d)
          rsync -a --exclude='.git' --exclude='venv' --exclude='__pycache__' \
                   --exclude='.DS_Store' --exclude='.env' --exclude='.gitignore' \
                   . "$DEPLOY_DIR/"
          cd "$DEPLOY_DIR"
          git init -b main
          git lfs install
          git lfs track "*.parquet"
          git lfs track "*.pkl"
          git add .gitattributes
          git add -A
          git -c user.name="GitHub Actions" -c user.email="actions@github.com" \
              commit -m "Deploy from $(git -C $GITHUB_WORKSPACE rev-parse --short HEAD)"
          git remote add hf https://LMK08:${HF_TOKEN}@huggingface.co/spaces/LMK08/ACP-Dashboard
          git push hf main --force
          echo "Successfully deployed to Hugging Face Space"
