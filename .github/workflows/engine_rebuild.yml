name: Engine Rebuild (ACP ratings/projections)

# Rebuilds the ACP engine (rating v6.9.x, projection v2.1) from the
# canonical raw_events.parquet (Option D). Runs AFTER the scheduled data
# refresh so the engine never drifts behind the data. Reads the engine
# pipeline code from the private GPA-Model-Engine repo (read-only deploy
# key) and writes the engine output parquets back into this repo + HF.

permissions:
  contents: write
  actions: write      # dispatches deploy_to_hf.yml after committing

on:
  workflow_run:
    workflows: ["Scheduled Data Update"]
    types: [completed]
  workflow_dispatch:        # manual run from the Actions tab
    inputs:
      deploy:
        description: 'Commit + deploy results (false = validate only)'
        required: false
        default: 'false'

concurrency:
  group: hf-deploy          # share with deploy/refresh — never push HF simultaneously
  cancel-in-progress: false

jobs:
  check-inputs:
    # A scheduled rebuild only runs when the engine's inputs changed (the
    # Oct 2026 refreshes logged "No new events fetched" five runs in a row
    # and each still ran a 30-60 min rebuild + recommit). Manual runs always
    # rebuild.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.fp.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: fp
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          pip install -q huggingface_hub
          changed=$(python scripts/engine_inputs_fp.py --changed)
          echo "engine inputs changed: $changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = "false" ]; then
            # This run holds the hf-deploy group, so a code-push deploy that was
            # waiting may have been cancelled in its favour — re-dispatch one so
            # a code push always reaches the Space (cheap: smoke + no-op deploy).
            gh workflow run deploy_to_hf.yml --ref main
          fi

  rebuild-engine:
    needs: check-inputs
    if: ${{ needs.check-inputs.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out dashboard repo (into sibling layout)
        uses: actions/checkout@v4
        with:
          path: Match_Reports_API/Dashboard

      - name: Check out GPA engine repo (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: LMK08/GPA-Model-Engine
          ssh-key: ${{ secrets.GPA_DEPLOY_KEY }}
          path: GPA Model Project v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: Match_Reports_API/Dashboard/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Match_Reports_API/Dashboard/requirements.txt
          # explicit engine deps (in case the dashboard reqs omit them).
          # streamlit is NOT in requirements.txt (the HF Space SDK provides
          # it) but Phase 3 runs `app.py --precompute`, which imports it.
          # streamlit pinned to the Space's version (an unpinned install got
          # 1.66 while the Space runs 1.50 — Phase 3 writes the caches it reads)
          pip install xgboost scikit-learn scipy pyarrow joblib pandas numpy "streamlit==1.50.0" huggingface_hub
          # The dashboard pins pandas==2.3.3 for HF Space stability, but the
          # engine chain OOMs the 16 GB runner on 2.x (object-dtype strings).
          # Override to pandas 3.x HERE ONLY — Arrow-backed strings cut the
          # event-frame memory ~3x; this is what the June 2026 green runs used.
          # The HF Space itself still installs from requirements.txt untouched.
          pip install "pandas==3.0.3"

      - name: Download canonical raw_events from HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          curl -L -f -o "Match_Reports_API/Dashboard/raw_events.parquet" \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            "https://huggingface.co/spaces/ACP-Analytics/ACP-Dashboard/resolve/main/raw_events.parquet"
          echo "raw_events: $(du -h Match_Reports_API/Dashboard/raw_events.parquet | cut -f1)"

      - name: Phase 0 — split canonical events into engine league files
        working-directory: GPA Model Project v2
        env:
          RAW_EVENTS_PATH: ${{ github.workspace }}/Match_Reports_API/Dashboard/raw_events.parquet
          # exact_minutes.py reads match_player_minutes.parquet + league_config.py here
          DASHBOARD_DIR: ${{ github.workspace }}/Match_Reports_API/Dashboard
        run: python src/split_events_for_engine.py

      - name: Phase 1 — GPA chain (normalize → action values → export)
        working-directory: GPA Model Project v2
        env:
          DASHBOARD_DIR: ${{ github.workspace }}/Match_Reports_API/Dashboard
        run: |
          set -e
          python src/normalize_events.py liga3
          python src/normalize_events.py campeonato
          python src/targets.py
          python src/features.py
          python src/xpass.py
          python src/action_values.py
          python src/export_viz_aggregates.py
          python src/phases.py
          python src/gk_shotstopping.py || echo "gk_shotstopping nonzero (continuing)"
          python src/gk_handling.py     || echo "gk_handling nonzero (continuing)"
          python src/loso_player_ratings.py
          python src/export_to_dashboard.py

      - name: Phase 2 — dashboard chain (duels → rating → projection → engine export)
        working-directory: Match_Reports_API/Dashboard
        run: |
          set -e
          python models/duels/build_contests.py
          python models/duels/glicko_ladders.py
          python models/defr/compute_defr.py
          python models/roles/build_role_features.py
          python models/roles/cluster_roles.py
          python models/ratings/build_intervals.py
          python models/ratings/rapm_v4.py
          python models/ratings/build_pass_split.py
          python models/ratings/build_rating.py
          python models/ratings/build_projection.py
          python models/ratings/league_conversion.py
          python models/ratings/build_player_engine.py
          # Projected-value interval: fee-calibrated conformal band around the
          # engine value (seconds). Must run AFTER build_player_engine.py — it
          # pairs the real sales with the freshly rebuilt engine rows.
          python models/value/eur_intervals.py || echo "eur_intervals nonzero (continuing — the committed calibration stays)"
          # Scoreline model: Dixon-Coles fit + walk-forward backtest (seconds)
          python models/scoreline/build_dc.py
          # Season simulation on that fit (seconds), so a re-tuned
          # dc_params.json never leaves the promotion odds and the scoreline
          # forecast on different parameters until the next data refresh.
          python simulate_season.py --no-refit || echo "simulate_season nonzero (continuing — the committed pickle stays)"

      - name: Phase 3 — warm player-stats caches
        working-directory: Match_Reports_API/Dashboard
        # fatal: a failed precompute used to be swallowed and the run still
        # committed/deployed whatever caches it had
        run: python app.py --precompute

      - name: Commit refreshed engine parquets to GitHub
        if: ${{ github.event_name == 'workflow_run' || github.event.inputs.deploy == 'true' }}
        working-directory: Match_Reports_API/Dashboard
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'github-actions-bot@users.noreply.github.com'
          # commit the app-read engine outputs + the precomputed stats
          # caches. The caches are committed (not just rsync-shipped) so
          # deploy_to_hf — which runs on every code push and only COPIES
          # tracked files into the HF clone — also reliably ships/refreshes
          # them. Without this, a code-push deploy between engine rebuilds
          # could leave HF without the caches (the symptom Lucas hit). The
          # ~20MB/refresh git cost is offset by the Tier-B binary cleanup.
          git add -f gpa_player_season_values.parquet \
                     obv_match_minute.parquet obv_pass_pairs.parquet \
                     obv_match_player.parquet obv_team_season.parquet \
                     possession_phases.parquet team_phase_profile.parquet \
                     models/ratings/*.parquet models/ratings/*.json \
                     models/value/*.json models/scoreline/*.json \
                     models/duels/*.parquet models/defr/*.parquet \
                     models/roles/role_features_season.parquet \
                     models/roles/role_assignments_season.parquet \
                     models/roles/*.joblib season_simulation.pkl
          # (role_features_match.parquet ~62 MB, role_assignments_match and the
          # role-atlas PNG are chain intermediates the app never reads — they
          # are rebuilt every run and are no longer committed; the repo had
          # grown to 2.25 GB recommitting them.)
          # inputs fingerprint: lets the next scheduled run skip when unchanged
          python scripts/engine_inputs_fp.py --write
          git add -f models/ratings/engine_inputs.sha
          git add -f stats_cache/ 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: automated engine rebuild (ratings/projections)"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "No engine changes to commit."
          fi

      - name: Deploy through deploy_to_hf.yml (smoke-tested in the Space's environment)
        # The rebuild runs pandas 3 (memory), the Space pandas 2.3.3 — so the
        # page smoke tests must run in deploy_to_hf's Space-equivalent env.
        # raw_events is never changed by the engine, so deploy_to_hf (which
        # keeps the Space's raw_events) ships everything this run committed.
        if: ${{ github.event_name == 'workflow_run' || github.event.inputs.deploy == 'true' }}
        working-directory: Match_Reports_API/Dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy_to_hf.yml --ref main
