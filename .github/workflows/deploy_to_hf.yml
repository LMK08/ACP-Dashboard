name: Deploy to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Remove .gitignore before upload so that LFS data files
          # (*.parquet, *.pkl) are not skipped by upload_folder
          rm -f .gitignore
          pip install huggingface-hub
          python - <<'PYEOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              folder_path=".",
              repo_id="LMK08/ACP-Dashboard",
              repo_type="space",
              ignore_patterns=[".*", "venv/**", "__pycache__/**"],
          )
          print("Successfully synced to Hugging Face Space")
          PYEOF
