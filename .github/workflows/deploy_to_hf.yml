name: Deploy to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Build a clean single-commit repo with LFS for large files,
          # then force-push to HF. This avoids LFS version accumulation
          # (only one commit = only one copy of each file).
          DEPLOY_DIR=$(mktemp -d)
          rsync -a --exclude='.git' --exclude='venv' --exclude='__pycache__' \
                   --exclude='.DS_Store' --exclude='.env' --exclude='.gitignore' \
                   . "$DEPLOY_DIR/"
          cd "$DEPLOY_DIR"
          git init
          git lfs install
          git lfs track "*.parquet" "*.pkl"
          git add -A
          git -c user.name="GitHub Actions" -c user.email="actions@github.com" \
              commit -m "Deploy from $(git -C $GITHUB_WORKSPACE rev-parse --short HEAD)"
          git remote add hf https://LMK08:${HF_TOKEN}@huggingface.co/spaces/LMK08/ACP-Dashboard
          git push hf main --force
          echo "Successfully deployed to Hugging Face Space"
