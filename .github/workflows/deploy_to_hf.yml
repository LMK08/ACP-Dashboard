name: Deploy to Hugging Face

on:
  push:
    branches: [main]
    # Don't trigger on data-only changes (scheduled_update has its own deploy)
    paths-ignore:
      - '**.pkl'
      - '**.parquet'
  workflow_dispatch:

# Prevent concurrent deploys from stomping on each other. QUEUE, never
# cancel: cancel-in-progress:true killed in-flight engine rebuilds twice
# (2026-08-09, 2026-08-16) when a code push landed mid-rebuild — the group
# exists to serialise HF pushes, and queueing achieves that.
concurrency:
  group: hf-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out GitHub repository
        uses: actions/checkout@v4
        with:
          path: github-repo

      - name: Clone existing HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Clone the EXISTING HF repo so we preserve all data files (raw_events.parquet, etc.)
          # This avoids the "wipe and replace" problem of git init + force-push.
          GIT_LFS_SKIP_SMUDGE=1 git clone \
            https://LMK08:${HF_TOKEN}@huggingface.co/spaces/ACP-Analytics/ACP-Dashboard \
            hf-repo || {
              echo "HF repo doesn't exist yet — creating fresh"
              mkdir -p hf-repo && cd hf-repo && git init -b main
              git lfs install
              git lfs track "*.parquet" "*.pkl"
              git add .gitattributes
            }
          echo "✅ HF repo cloned (LFS pointers only, data files preserved on remote)"

      - name: Update code files in HF repo
        run: |
          # Copy code + config + committed data files from GitHub into the HF
          # clone, MIRRORING deletions: a file removed from the GitHub repo
          # must also be removed from the HF Space. Before 2026-08-16 this step
          # only ever copied, so stats_cache parquets deleted from git survived
          # on the Space and kept serving matchweek-1 data. The only artifact
          # deliberately left untouched on HF is raw_events.parquet (178MB,
          # HF-only — never committed to GitHub, explicitly protected below).
          # README.md and .gitattributes are managed by the force-push deploys
          # (scheduled_update / engine_rebuild) and never touched here.
          cd github-repo

          # Code + config files.
          for f in *.py requirements.txt config.yaml league_config.py Dockerfile; do
            if [ -f "$f" ]; then
              cp "$f" ../hf-repo/
            fi
          done

          # Every committed root-level data file (.pkl + .parquet). Shipping
          # these on every code deploy keeps HF in sync with GitHub even when the
          # force-push data workflows (scheduled_update / engine_rebuild) aren't
          # running — e.g. the off-season pause, or a hand-committed hotfix like
          # the Camp 23/24 minutes correction (c7baa3a). Before this, such a file
          # silently went stale on HF until the next force-push deploy: the fix
          # also bumped models/ratings/player_engine.parquet + stats_cache/*
          # (which ship via the directory copy below and updated fine) but
          # complete_player_minutes.pkl was not in the old whitelist, so HF kept
          # the old LFS oid. The HF clone's .gitattributes already tracks *.pkl /
          # *.parquet via LFS, so each file copied here is auto-converted to an
          # LFS object on `git add`. raw_events.parquet is HF-only (uncommitted)
          # so it is never matched. Subdir data (models/, stats_cache/,
          # valuations/) ships via the directory copy below. Covers e.g.
          # complete_player_minutes.pkl, match_lineups.pkl, player_details.pkl,
          # all_match_data.pkl, matches_summary.parquet, season_simulation.pkl,
          # gpa_player_season_values.parquet.
          for f in $(git ls-files '*.pkl' '*.parquet' | grep -v '/'); do
            cp "$f" ../hf-repo/
          done

          # Copy any subdirectories that contain code (not data)
          # - .streamlit: Streamlit config
          # - models:     v2 EUR regression artifacts (predict.py +
          #               __init__.py + ridge .joblib/.json bundles)
          # - valuations: load_valuations.py + reported_fees.csv +
          #               manual_entries.csv + valuations.parquet +
          #               TM scrape outputs
          # stats_cache: committed precomputed player-stats parquets — ship
          # them so the deployed app reads caches instead of recomputing from
          # the 2.3M-row events frame on first load of each league/season.
          # rsync --delete mirrors the dir exactly: files deleted from git are
          # deleted from HF too, and a dir dropped from git entirely is removed.
          # icons: team crest PNGs for the scatter plots — LFS-tracked on HF
          # (see the push step) so the pre-receive binary hook accepts them.
          for d in .streamlit models valuations stats_cache icons; do
            if [ -d "$d" ]; then
              rsync -a --delete "$d/" "../hf-repo/$d/"
            elif [ -d "../hf-repo/$d" ]; then
              rm -rf "../hf-repo/$d"
              echo "🗑  removed $d/ (deleted from GitHub repo)"
            fi
          done

          # Mirror root-level deletions: any file of the kinds the loops above
          # manage (*.py, *.pkl, *.parquet, config files) that exists in the HF
          # clone but no longer exists in the GitHub repo gets removed.
          # raw_events.parquet is HF-only and must always survive.
          (
            cd ../hf-repo
            for f in *.py *.pkl *.parquet requirements.txt config.yaml Dockerfile; do
              [ -f "$f" ] || continue
              [ "$f" = "raw_events.parquet" ] && continue
              if [ ! -f "../github-repo/$f" ]; then
                rm -f "$f"
                echo "🗑  removed stale $f (deleted from GitHub repo)"
              fi
            done
          )

          # Strip generated image artifacts — the running app never loads
          # them, and HF's pre-receive hook rejects raw binaries (e.g. PNGs)
          # that aren't stored via LFS/Xet. Drop any plots dirs + loose
          # images, EXCEPT icons/ (team crests the scatter plots load at
          # runtime — they ship via LFS, see the push step).
          find ../hf-repo -type d -name plots -exec rm -rf {} + 2>/dev/null || true
          find ../hf-repo -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) -not -path '*/icons/*' -delete 2>/dev/null || true

          echo "✅ Code files updated (deletions mirrored)"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd hf-repo
          git lfs install
          # Crest PNGs must ride LFS or HF's pre-receive hook rejects the
          # push (the 2026-06-17 failure mode). The force-push deploys
          # (scheduled_update / engine_rebuild) track the same pattern, so
          # .gitattributes stays consistent across deploy paths.
          git lfs track "icons/*.png"
          git add .gitattributes
          git add -A

          # Only push if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git -c user.name="GitHub Actions" -c user.email="actions@github.com" \
                commit -m "Code update from $(git -C $GITHUB_WORKSPACE/github-repo rev-parse --short HEAD)"
            git push
            echo "✅ Successfully deployed code update to Hugging Face Space"
          fi
