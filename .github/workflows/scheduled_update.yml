name: Scheduled Data Update

permissions:
  contents: write

on:
  schedule:
    # Runs at 05:00 UTC on Sunday and Monday,
    # which is 12:00 AM EST (midnight) on Sat/Sun night.
    - cron: '0 5 * * 0,1'
  
  # This line allows you to run the update manually from the GitHub "Actions" tab
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 
          cache: 'pip'
          cache-dependency-path: requirements.txt 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests python-dotenv

      - name: Run process_data.py
        env:
          WYSCOUT_USER: ${{ secrets.WYSCOUT_USER }}
          WYSCOUT_PASS: ${{ secrets.WYSCOUT_PASS }}
        run: python process_data.py

      - name: Run get_player_details.py
        env:
          WYSCOUT_USER: ${{ secrets.WYSCOUT_USER }}
          WYSCOUT_PASS: ${{ secrets.WYSCOUT_PASS }}
        run: python get_player_details.py

      - name: Precompute complete player minutes
        run: python precompute_minutes.py

      - name: Fetch team advanced stats
        env:
          WYSCOUT_USER: ${{ secrets.WYSCOUT_USER }}
          WYSCOUT_PASS: ${{ secrets.WYSCOUT_PASS }}
        run: python fetch_team_stats.py

      - name: Update prediction model
        run: python update_model.py

      - name: Simulate season probabilities
        run: python simulate_season.py

      - name: Commit and push new data to GitHub
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'github-actions-bot@users.noreply.github.com'

          git add -f *.parquet
          git add -f *.pkl

          if [ -n "$(git status --porcelain)" ]; then
            echo "New data found. Committing and pushing..."
            git commit -m "chore: Automated data refresh"
            git push
          else
            echo "No data changes to commit."
          fi

      - name: Push updated data to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface-hub
          python - <<'PYEOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              folder_path=".",
              repo_id="LMK08/ACP-Dashboard",
              repo_type="space",
              ignore_patterns=[".*", "venv/**", "__pycache__/**"],
          )
          print("Successfully synced to Hugging Face Space")
          PYEOF